<style>
:root{--a3:190 242 100;--a4:163 230 53;--z7:63 63 70;--z8:39 39 42;--z9:24 24 27;--bg:9 11 14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:rgb(var(--bg));color:#e4e4e7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.fd{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.01em}

body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before,body::after{content:'';position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
body::before{width:70vmax;height:70vmax;left:-25vmax;top:-25vmax;background:rgb(var(--a4));opacity:.28}

@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
.bg-zinc-900{background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.025))!important;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-color:rgba(255,255,255,.1)!important;box-shadow:0 12px 32px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07)}

.sh{position:relative;overflow:hidden}.sh::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-130%);animation:shine 3.6s ease-in-out infinite}
