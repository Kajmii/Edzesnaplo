<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Pro – Edzés</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16171A}a:hover{color:#C2410C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ECEAE5; color: #16171A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #CFCCC4">
    <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="#16171A" stroke-width="1.6"></path></svg>
      <span>Vissza</span>
    </a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">42:18</span>
    <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #16171A; background: transparent; border-radius: 4px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #16171A">Befejezés</button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 24px 0 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between">
        <span style="font-size: 13px; color: #5B5C60">Felsőtest A</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B5C60">2 / 6</span>
      </div>
      <h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em">Ferde pados súlyzós nyomás</h1>
      <span style="font-size: 13px; color: #5B5C60">Cél 3&nbsp;×&nbsp;8–10 · legutóbb 32,5&nbsp;kg × 10</span>
    </div>

    <table style="width: 100%; border-collapse: collapse; font-family: 'IBM Plex Mono', monospace; font-size: 15px">
      <thead>
        <tr style="font-size: 11px; letter-spacing: 0.08em; color: #5B5C60; text-align: left">
          <th scope="col" style="font-weight: 400; padding: 0 0 8px 0">SOR.</th>
          <th scope="col" style="font-weight: 400; padding: 0 0 8px 0">KG</th>
          <th scope="col" style="font-weight: 400; padding: 0 0 8px 0">ISM</th>
          <th scope="col" style="font-weight: 400; padding: 0 0 8px 0">RPE</th>
          <th scope="col" style="font-weight: 400; padding: 0 0 8px 0; text-align: right">KÉSZ</th>
        </tr>
      </thead>
      <tbody>
        <tr style="border-top: 1px solid #CFCCC4; color: #5B5C60"><td style="padding: 12px 0">B</td><td>20,0</td><td>12</td><td>–</td><td style="text-align: right">✓</td></tr>
        <tr style="border-top: 1px solid #CFCCC4"><td style="padding: 12px 0">1</td><td>32,5</td><td>10</td><td>8</td><td style="text-align: right">✓</td></tr>
        <tr style="border-top: 1px solid #CFCCC4"><td style="padding: 12px 0">2</td><td>32,5</td><td>9</td><td>8,5</td><td style="text-align: right">✓</td></tr>
        <tr style="border-top: 1px solid #CFCCC4; background: #F7F6F3">
          <td style="padding: 8px 0 8px 6px; font-weight: 500">3</td>
          <td><input type="text" inputmode="decimal" aria-label="3. sorozat súly" value="32,5" style="width: 56px; height: 36px; box-sizing: border-box; border: 1px solid #16171A; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 0 6px"></td>
          <td><input type="text" inputmode="numeric" aria-label="3. sorozat ismétlés" placeholder="–" style="width: 44px; height: 36px; box-sizing: border-box; border: 1px solid #16171A; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 0 6px"></td>
          <td><input type="text" inputmode="decimal" aria-label="3. sorozat RPE" placeholder="–" style="width: 44px; height: 36px; box-sizing: border-box; border: 1px solid #16171A; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 0 6px"></td>
          <td style="text-align: right; padding-right: 6px"><input type="checkbox" aria-label="3. sorozat kész" style="width: 22px; height: 22px; accent-color: {{accent}}"></td>
        </tr>
      </tbody>
    </table>

    <button type="button" style="align-self: flex-start; height: 40px; border: none; background: transparent; padding: 0; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: #16171A; text-decoration: underline; text-underline-offset: 3px">+ Sorozat hozzáadása</button>

    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-top: 1px solid #CFCCC4; border-bottom: 1px solid #CFCCC4">
      <span style="font-size: 13px; color: #5B5C60">Következő</span>
      <span style="font-size: 14px">Ülő csigás evezés · <span style="font-family: 'IBM Plex Mono', monospace">3&nbsp;×&nbsp;10</span></span>
    </div>
  </main>

  <section aria-label="Pihenőidő" style="padding: 18px 24px 24px 24px; background: #F7F6F3; border-top: 1px solid #CFCCC4; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #5B5C60">PIHENŐ</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">01:12</span>
      </div>
      <div style="display: flex; gap: 6px">
        <button type="button" aria-label="15 másodperccel kevesebb" style="width: 48px; height: 44px; border: 1px solid #16171A; background: transparent; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #16171A">−15</button>
        <button type="button" aria-label="15 másodperccel több" style="width: 48px; height: 44px; border: 1px solid #16171A; background: transparent; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #16171A">+15</button>
      </div>
    </div>
    <div style="height: 2px; background: #CFCCC4"><div style="width: 60%; height: 2px; background: {{accent}}"></div></div>
    <button type="button" style="height: 52px; border: none; border-radius: 4px; background: #16171A; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: 500">Sorozat kész</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1F5C4A","#1E3A8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C2410C' };
  }
}
</script>
</body>
</html>
