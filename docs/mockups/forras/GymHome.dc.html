<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Gym – Kezdőlap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F3F0E8}a:hover{color:#FFC93C}
.gym-stripe{background:repeating-linear-gradient(-45deg,#FFC93C 0 9px,#0F0F0D 9px 18px)}
.gym-btn{transition:transform .08s linear}
.gym-btn:active{transform:scale(.97)}
.gym-btn:focus-visible{outline:3px solid #FFC93C;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.gym-btn{transition:none}.gym-btn:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0F0D; color: #F3F0E8; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div class="gym-stripe" style="height: 8px"></div>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 0 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-weight: 800; font-size: 12px; letter-spacing: 0.16em; color: {{accent}}">42. HÉT · NAP 3/5</span>
      <button type="button" aria-label="Profil" style="width: 44px; height: 44px; background: #2B2B27; border: none; color: #F3F0E8; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 13px">DM</button>
    </div>

    <div style="display: flex; flex-direction: column">
      <span style="font-weight: 600; font-size: 13px; letter-spacing: 0.12em; color: #A8A49A">MAI EDZÉS</span>
      <h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 112px; line-height: 0.9; letter-spacing: 0.01em">PUSH</h1>
      <span style="font-size: 15px; color: #A8A49A; margin-top: 6px">Mell · Váll · Tricepsz · 6&nbsp;gyakorlat</span>
    </div>

    <a href="GymWorkout.dc.html" style="height: 64px; background: {{accent}}; color: #0F0F0D; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-family: 'Anton', sans-serif; font-size: 26px; letter-spacing: 0.04em">
      <span>EDZÉS INDÍTÁSA</span>
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M4 14h18M15 6l8 8-8 8" fill="none" stroke="#0F0F0D" stroke-width="3"></path></svg>
    </a>

    <section aria-label="Heti sorozatok izomcsoportonként" style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-weight: 800; font-size: 12px; letter-spacing: 0.16em; color: #A8A49A">HETI SOROZATOK</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Mell: 12 a 16-ból"><circle cx="38" cy="38" r="36" fill="#2B2B27"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="#3A3A35" stroke-width="7"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="{{accent}}" stroke-width="7" stroke-dasharray="141 189" transform="rotate(-90 38 38)"></circle><circle cx="38" cy="38" r="8" fill="#0F0F0D"></circle></svg>
          <span style="font-family: 'Anton', sans-serif; font-size: 18px">12/16</span>
          <span style="font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: #A8A49A">MELL</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Hát: 9 a 16-ból"><circle cx="38" cy="38" r="36" fill="#2B2B27"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="#3A3A35" stroke-width="7"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="{{accent}}" stroke-width="7" stroke-dasharray="106 189" transform="rotate(-90 38 38)"></circle><circle cx="38" cy="38" r="8" fill="#0F0F0D"></circle></svg>
          <span style="font-family: 'Anton', sans-serif; font-size: 18px">9/16</span>
          <span style="font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: #A8A49A">HÁT</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Láb: 6 a 14-ből"><circle cx="38" cy="38" r="36" fill="#2B2B27"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="#3A3A35" stroke-width="7"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="{{accent}}" stroke-width="7" stroke-dasharray="81 189" transform="rotate(-90 38 38)"></circle><circle cx="38" cy="38" r="8" fill="#0F0F0D"></circle></svg>
          <span style="font-family: 'Anton', sans-serif; font-size: 18px">6/14</span>
          <span style="font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: #A8A49A">LÁB</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="Váll: 10 a 12-ből"><circle cx="38" cy="38" r="36" fill="#2B2B27"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="#3A3A35" stroke-width="7"></circle><circle cx="38" cy="38" r="30" fill="none" stroke="{{accent}}" stroke-width="7" stroke-dasharray="157 189" transform="rotate(-90 38 38)"></circle><circle cx="38" cy="38" r="8" fill="#0F0F0D"></circle></svg>
          <span style="font-family: 'Anton', sans-serif; font-size: 18px">10/12</span>
          <span style="font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: #A8A49A">VÁLL</span>
        </div>
      </div>
    </section>

    <section style="display: flex; background: #1C1C19">
      <div class="gym-stripe" style="width: 10px"></div>
      <div style="flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-weight: 800; font-size: 11px; letter-spacing: 0.16em; color: {{accent}}">ÚJ REKORD</span>
          <span style="font-weight: 600; font-size: 15px">Fekvenyomás · 2&nbsp;napja</span>
        </div>
        <span style="font-family: 'Anton', sans-serif; font-size: 40px; line-height: 1">102,5<span style="font-size: 18px; color: #A8A49A"> KG</span></span>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 12px">
      <div style="display: flex; gap: 3px" aria-hidden="true">
        <span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span><span style="width: 6px; height: 20px; background: {{accent}}"></span>
      </div>
      <span style="font-weight: 800; font-size: 13px; letter-spacing: 0.12em">12 HETES SZÉRIA</span>
    </div>
  </main>

  <!-- Megvalósításban valódi <button aria-expanded="false" aria-controls="menu-list">. A mockupban link, hogy a vásznon kattintható legyen. -->
  <a href="GymMenu.dc.html" role="button" aria-expanded="false" aria-controls="gym-menu-list" class="gym-btn" style="flex-shrink: 0; min-height: 72px; box-sizing: border-box; padding-bottom: env(safe-area-inset-bottom); display: flex; align-items: stretch; background: #1C1C19; text-decoration: none; color: #F3F0E8">
    <span class="gym-stripe" style="width: 10px; flex-shrink: 0"></span>
    <span style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 8px 12px 8px 16px; min-width: 0"><span style="font-family: 'Anton', sans-serif; font-size: 26px; line-height: 1; letter-spacing: 0.04em">MENÜ</span><span style="font-weight: 800; font-size: 11px; letter-spacing: 0.14em; color: #A8A49A; overflow-wrap: break-word">EDZÉS · NAPLÓ · ÉTEL · +7</span></span>
    <span style="width: 72px; flex-shrink: 0; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="#0F0F0D" stroke-width="3"></path></svg></span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC93C","options":["#FFC93C","#FF5A1F","#7CFF4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFC93C' };
  }
}
</script>
</body>
</html>
