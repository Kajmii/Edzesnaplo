<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Family – Edzés</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B5E}a:hover{color:#0A4F45}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F4F0; color: #1A2420; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 20px; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 12px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
    <a href="FamilyHome.dc.html" style="height: 56px; align-self: flex-start; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 20px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6"></path></svg>
      <span>Vissza</span>
    </a>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 19px; color: #46524D">2. gyakorlat a 4&#8209;ből</span>
      <div role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="2" aria-label="Haladás" style="height: 12px; border-radius: 6px; background: #D7DED9"><div style="width: 50%; height: 12px; border-radius: 6px; background: {{accent}}"></div></div>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 0 20px; min-height: 0">
    <div style="flex: 0 1 180px; min-height: 120px; background: #FFFFFF; border: 2px solid #CDD5D0; border-radius: 20px; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 200 150" style="width: auto; height: 100%; max-height: 150px; padding: 10px 0; box-sizing: border-box; overflow: visible" role="img" aria-label="Rajz: széken ülő ember kinyújtja az egyik lábát">
        <path d="M60 60v80M60 100h60v40M120 100v40" fill="none" stroke="#9AA6A0" stroke-width="5" stroke-linecap="round"></path>
        <circle cx="84" cy="30" r="13" fill="none" stroke="#1A2420" stroke-width="5"></circle>
        <path d="M84 44v44h34" fill="none" stroke="#1A2420" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M118 88l14 40" fill="none" stroke="#1A2420" stroke-width="5" stroke-linecap="round"></path>
        <path d="M100 92l58-6" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round"></path>
        <path d="M84 58l22 18" fill="none" stroke="#1A2420" stroke-width="5" stroke-linecap="round"></path>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700">Lábemelés ülve</h1>
      <p style="margin: 0; font-size: 20px; line-height: 1.4">Ülj egyenesen. Lassan nyújtsd ki az egyik lábad, tartsd meg két másodpercig, majd tedd vissza. Felváltva.</p>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border: 2px solid #CDD5D0; border-radius: 20px; padding: 12px 20px">
      <span style="font-size: 19px; color: #46524D; white-space: nowrap">1. kör a 2&#8209;ből</span>
      <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 48px; font-weight: 700; line-height: 1">10</span><span style="font-size: 20px">ismétlés</span></span>
    </div>

    <a href="#video" style="height: 48px; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="currentColor" stroke-width="2.4"></circle><path d="M10.5 8.5v9l7-4.5z" fill="currentColor"></path></svg>
      <span>Hogyan csináljam? Videó</span>
    </a>
  </main>

  <footer style="flex-shrink: 0; padding: 12px 20px calc(20px + env(safe-area-inset-bottom)) 20px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 64px; border: none; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 22px; font-weight: 700">Kész, jöhet a következő</button>
    <button type="button" style="height: 56px; border: 2px solid #1A2420; border-radius: 16px; background: transparent; color: #1A2420; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 20px; font-weight: 700">Most kihagyom</button>
    <p style="margin: 0; font-size: 17px; color: #46524D; text-align: center">Ha fájdalmat érzel, állj meg és pihenj.</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E6B5E","options":["#0E6B5E","#A8481F","#1F4E99"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0E6B5E' };
  }
}
</script>
</body>
</html>
