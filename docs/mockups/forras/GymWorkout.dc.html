<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Gym – Edzés</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F3F0E8}a:hover{color:#FFC93C}
.gym-stripe{background:repeating-linear-gradient(-45deg,#FFC93C 0 9px,#1C1C19 9px 18px)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F0F0D; color: #F3F0E8; font-family: 'Archivo', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #1C1C19">
    <a href="GymHome.dc.html" aria-label="Vissza" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M14 4l-7 7 7 7" fill="none" stroke="#F3F0E8" stroke-width="3"></path></svg>
    </a>
    <span style="font-family: 'Anton', sans-serif; font-size: 24px; letter-spacing: 0.04em">PUSH</span>
    <span style="width: 64px; text-align: right; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums">42:18</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 0 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 800; font-size: 12px; letter-spacing: 0.16em; color: {{accent}}">GYAKORLAT 2/6</span>
      <h1 style="margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 38px; line-height: 1; letter-spacing: 0.01em">FERDE PADOS NYOMÁS</h1>
    </div>

    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: 'Anton', sans-serif; font-size: 76px; line-height: 0.95">100</span>
      <span style="font-family: 'Anton', sans-serif; font-size: 28px; color: #A8A49A">KG</span>
      <span style="font-family: 'Anton', sans-serif; font-size: 52px; margin-left: 6px">× 8</span>
    </div>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <svg viewBox="0 0 350 104" style="width: 100%; height: auto; display: block" role="img" aria-label="Rúd terhelése: oldalanként 20, 15 és 5 kilós tárcsa">
        <rect x="0" y="49" width="350" height="6" fill="#8A8780"></rect>
        <rect x="120" y="47" width="110" height="10" fill="#6E6B65"></rect>
        <rect x="104" y="40" width="8" height="24" fill="#B9B5AC"></rect>
        <rect x="238" y="40" width="8" height="24" fill="#B9B5AC"></rect>
        <rect x="86" y="4" width="16" height="96" fill="#2F62D0"></rect>
        <rect x="70" y="10" width="14" height="84" fill="#E3B23C"></rect>
        <rect x="58" y="24" width="10" height="56" fill="#E8E6E0"></rect>
        <rect x="248" y="4" width="16" height="96" fill="#2F62D0"></rect>
        <rect x="266" y="10" width="14" height="84" fill="#E3B23C"></rect>
        <rect x="282" y="24" width="10" height="56" fill="#E8E6E0"></rect>
      </svg>
      <figcaption style="font-weight: 600; font-size: 12px; letter-spacing: 0.1em; color: #A8A49A">OLDALANKÉNT 20 + 15 + 5 · RÚD 20&nbsp;KG</figcaption>
    </figure>

    <div role="list" aria-label="Sorozatok" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <div role="listitem" style="height: 56px; background: #2B2B27; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Anton', sans-serif; font-size: 20px; color: {{accent}}">✓</span><span style="font-size: 11px; color: #A8A49A">100×8</span></div>
      <div role="listitem" style="height: 56px; background: #2B2B27; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Anton', sans-serif; font-size: 20px; color: {{accent}}">✓</span><span style="font-size: 11px; color: #A8A49A">100×8</span></div>
      <div role="listitem" aria-current="step" style="height: 56px; border: 3px solid {{accent}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Anton', sans-serif; font-size: 24px">3</span></div>
      <div role="listitem" style="height: 56px; border: 1px solid #3A3A35; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Anton', sans-serif; font-size: 24px; color: #6E6B65">4</span></div>
      <div role="listitem" style="height: 56px; border: 1px solid #3A3A35; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Anton', sans-serif; font-size: 24px; color: #6E6B65">5</span></div>
    </div>
  </main>

  <section aria-label="Pihenőidő" style="padding: 16px 20px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #1C1C19; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column">
          <span style="font-weight: 800; font-size: 11px; letter-spacing: 0.16em; color: #A8A49A">PIHENŐ</span>
          <span style="font-family: 'Anton', sans-serif; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums">1:12</span>
        </div>
        <div style="display: flex; gap: 6px">
          <button type="button" aria-label="15 másodperccel kevesebb" style="width: 56px; height: 52px; border: none; background: #2B2B27; color: #F3F0E8; font-family: 'Anton', sans-serif; font-size: 18px">−15</button>
          <button type="button" aria-label="15 másodperccel több" style="width: 56px; height: 52px; border: none; background: #2B2B27; color: #F3F0E8; font-family: 'Anton', sans-serif; font-size: 18px">+15</button>
        </div>
      </div>
      <div style="height: 10px; background: #2B2B27"><div class="gym-stripe" style="width: 60%; height: 10px"></div></div>
    </div>
    <button type="button" style="height: 68px; border: none; background: {{accent}}; color: #0F0F0D; font-family: 'Anton', sans-serif; font-size: 28px; letter-spacing: 0.04em">SOROZAT KÉSZ</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC93C","options":["#FFC93C","#FF5A1F","#7CFF4F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFC93C' };
  }
}
</script>
</body>
</html>
