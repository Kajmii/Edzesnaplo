<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Pro – Kezdőlap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16171A}a:hover{color:#C2410C}
.pro-btn{transition:transform .12s ease-out}
.pro-btn:active{transform:scale(.97)}
.pro-btn:focus-visible{outline:2px solid #C2410C;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.pro-btn{transition:none}.pro-btn:active{transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ECEAE5; color: #16171A; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <main style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 26px 24px 0 24px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #5B5C60">KEDD · OKT. 13. · 42. HÉT</span>
      <button type="button" aria-label="Profil" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #16171A; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #16171A">DM</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #5B5C60">Mai edzés</span>
      <h1 style="margin: 0; font-size: 40px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em">Felsőtest A</h1>
      <span style="font-size: 14px; color: #5B5C60">6&nbsp;gyakorlat · kb. 55&nbsp;perc · utoljára 4&nbsp;napja</span>
    </div>

    <div style="display: flex; gap: 12px; align-items: center">
      <a href="ProWorkout.dc.html" style="flex: 1; height: 52px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-radius: 4px; font-weight: 500; font-size: 16px">
        <span>Edzés indítása</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="#FFFFFF" stroke-width="1.6"></path></svg>
      </a>
      <a href="#terv" style="height: 52px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #16171A; border-radius: 4px; text-decoration: none; font-size: 14px">Terv</a>
    </div>

    <section aria-label="Heti áttekintés" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; border-top: 1px solid #CFCCC4; padding-top: 14px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5C60">H</span><span style="width: 22px; height: 22px; background: #16171A"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5C60">K</span><span style="width: 22px; height: 22px; border: 2px solid {{accent}}; box-sizing: border-box"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5C60">SZ</span><span style="width: 22px; height: 22px; border: 1px solid #16171A; box-sizing: border-box"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5C60">CS</span><span style="width: 22px; height: 2px; margin: 10px 0; background: #8E8C86"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5C60">P</span><span style="width: 22px; height: 22px; border: 1px solid #16171A; box-sizing: border-box"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5C60">SZ</span><span style="width: 22px; height: 22px; border: 1px solid #16171A; box-sizing: border-box"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5B5C60">V</span><span style="width: 22px; height: 2px; margin: 10px 0; background: #8E8C86"></span></div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; background: #F7F6F3; padding: 16px; border-radius: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; color: #5B5C60">Heti volumen</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5B5C60">8&nbsp;hét</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 500; letter-spacing: -0.02em">18 420</span>
        <span style="font-size: 14px; color: #5B5C60">kg</span>
        <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13px">▲ 6,2%</span>
      </div>
      <svg viewBox="0 0 326 86" style="width: 100%; height: auto; display: block; overflow: visible" role="img" aria-label="Heti volumen az elmúlt 8 hétben, emelkedő trend">
        <line x1="0" y1="80" x2="326" y2="80" stroke="#CFCCC4" stroke-width="1"></line>
        <line x1="0" y1="45" x2="326" y2="45" stroke="#E2DFD8" stroke-width="1"></line>
        <line x1="0" y1="10" x2="326" y2="10" stroke="#E2DFD8" stroke-width="1"></line>
        <polyline points="4,74 50,62 97,66 143,49 190,55 236,34 283,30 322,15" fill="none" stroke="#16171A" stroke-width="1.6"></polyline>
        <circle cx="322" cy="15" r="4" fill="{{accent}}"></circle>
      </svg>
    </section>

    <section style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: #5B5C60; padding-bottom: 6px">Rekordok · becsült 1RM</span>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px solid #CFCCC4"><span style="font-size: 15px">Fekvenyomás</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">102,5&nbsp;kg</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px solid #CFCCC4"><span style="font-size: 15px">Guggolás</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">140,0&nbsp;kg</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px solid #CFCCC4; border-bottom: 1px solid #CFCCC4"><span style="font-size: 15px">Felhúzás</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">170,0&nbsp;kg</span></div>
    </section>
  </main>

  <!-- Megvalósításban valódi <button aria-expanded="false" aria-controls="menu-list">. A mockupban link, hogy a vásznon kattintható legyen. -->
  <a href="ProMenu.dc.html" role="button" aria-expanded="false" aria-controls="pro-menu-list" class="pro-btn" style="flex-shrink: 0; min-height: 64px; box-sizing: border-box; padding: 0 24px env(safe-area-inset-bottom) 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #ECEAE5; border-top: 1px solid #16171A; text-decoration: none; color: #16171A">
    <span style="font-size: 17px; font-weight: 600; white-space: nowrap">Menü</span>
    <span style="display: flex; align-items: center; gap: 10px; flex-shrink: 0"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #5B5C60">10 OLDAL</span><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 12l5-5 5 5" fill="none" stroke="#16171A" stroke-width="1.6"></path></svg></span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1F5C4A","#1E3A8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C2410C' };
  }
}
</script>
</body>
</html>
